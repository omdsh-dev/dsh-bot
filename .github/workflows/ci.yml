name: Plugin checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned package manager
        run: npm install --global pnpm@11.7.0
      - run: npm run check
      - run: npm run setup
      - run: npm test
      - run: npm run pack
      - run: npm run pack:infoflow
      - run: npm run pack:feishu
      - run: npm run test:install
      - run: npm run test:package
      - run: npm run test:infoflow-package
      - run: npm run test:infoflow-managed-package
      - run: npm run test:feishu-package
      - run: npm run test:im-isolation-package
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-bot-package
          path: |
            dist/*.tgz
            dist/SHA256SUMS
          if-no-files-found: error
