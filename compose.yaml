services:
  bot:
    build: .
    image: dsh-bot:local
    init: true
    network_mode: host
    environment:
      DSH_BOT_PORT: "${DSH_BOT_PORT:-3093}"
    volumes:
      - bot-data:/data
      - bot-workspace:/workspace
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    shm_size: 1gb
    restart: unless-stopped
volumes:
  bot-data:
  bot-workspace:
